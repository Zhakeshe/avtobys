<!DOCTYPE html>
<html lang="kk">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Avtobys — жолаушылар қолданбасы, QR, Bluetooth, төлем.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0175C2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avtobys">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Avtobys</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.avtobysRequestBluetoothDevice = function () {
      if (!navigator.bluetooth || typeof navigator.bluetooth.requestDevice !== 'function') {
        return Promise.reject(new Error('Bluetooth: браузер не поддерживает Web Bluetooth'));
      }
      return navigator.bluetooth.requestDevice({ acceptAllDevices: true }).then(function (d) {
        return d.name || d.id || '';
      });
    };
    (function () {
      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.avtobysTriggerPwaInstall = function () {
        if (!deferredPrompt) {
          return Promise.resolve(false);
        }
        var p = deferredPrompt;
        deferredPrompt = null;
        return p.prompt().then(function () {
          return p.userChoice;
        }).then(function (choice) {
          return Boolean(choice && choice.outcome === 'accepted');
        });
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
