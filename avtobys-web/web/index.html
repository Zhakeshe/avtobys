<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Avtobys web app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Avtobys">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Avtobys</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      var ua = window.navigator.userAgent || '';
      var isTouchMac = window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1;
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || isTouchMac;
      var standaloneByDisplayMode = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
      var standaloneByNavigator = window.navigator.standalone === true;
      var isStandalone = standaloneByDisplayMode || standaloneByNavigator;

      if (isIOS && !isStandalone) {
        document.body.innerHTML =
          '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;padding:20px;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;">' +
          '<section style="max-width:420px;width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 40px rgba(13,27,42,0.1);">' +
          '<h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;color:#0b1f3a;">Откройте Avtobys как приложение</h1>' +
          '<p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#4a5c76;">На iPhone вход разрешен только через Web App (иконка на главном экране).</p>' +
          '<ol style="margin:0 0 18px;padding-left:20px;color:#0b1f3a;font-size:16px;line-height:1.55;">' +
          '<li>Нажмите <strong>Поделиться</strong> в Safari.</li>' +
          '<li>Выберите <strong>На экран “Домой”</strong>.</li>' +
          '<li>Откройте Avtobys с иконки на главном экране.</li>' +
          '</ol>' +
          '<button type="button" onclick="window.location.reload()" style="width:100%;height:48px;border:none;border-radius:14px;background:#0d6efd;color:#fff;font-size:16px;font-weight:600;cursor:pointer;">Проверить снова</button>' +
          '</section>' +
          '</main>';
        return;
      }

      var flutterBootstrap = document.createElement('script');
      flutterBootstrap.src = 'flutter_bootstrap.js';
      flutterBootstrap.async = true;
      document.body.appendChild(flutterBootstrap);
    })();
  </script>
</body>
</html>
